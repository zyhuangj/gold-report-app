name: Update Gold Report

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    # Arizona 7:30 AM = 14:30 UTC
    # Arizona 7:30 PM = 02:30 UTC next day
    - cron: '30 14 * * *'
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate compact PDF report
        run: python scripts/generate_report.py

      - name: Commit updated report
        run: |
          git config user.name "gold-report-bot"
          git config user.email "gold-report-bot@users.noreply.github.com"
          git add public/index.html public/gold_report_compact.pdf public/latest_data.json
          git commit -m "Update gold report" || echo "No changes to commit"
          git push

      - name: Send Gmail PDF attachment
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_email.py
