name: Update Gold Report

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    # Arizona 00:30
    - cron: '30 7 * * *'

    # Arizona 04:30
    - cron: '30 11 * * *'

    # Arizona 08:30
    - cron: '30 15 * * *'

    # Arizona 12:30
    - cron: '30 19 * * *'

    # Arizona 16:30
    - cron: '30 23 * * *'

    # Arizona 20:30
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate gold dashboard
        run: |
          python scripts/generate_report.py

      - name: Commit updated dashboard
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add public/index.html
          git add public/*.pdf || true
          git commit -m "Update gold dashboard" || echo "No changes to commit"
          git push
