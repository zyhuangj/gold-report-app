<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>黃金宏觀儀表板｜自動更新版</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="update-bar">
      <div class="brand">
        <strong>黃金宏觀儀表板</strong>
        <span id="statusText">載入原始部署頁面中</span>
      </div>
      <div class="controls">
        <span id="lastChecked">尚未檢查</span>
        <button id="refreshBtn" type="button">手動更新</button>
        <label class="switch">
          <input id="autoRefresh" type="checkbox" checked>
          <span>每 10 秒自動更新</span>
        </label>
      </div>
    </header>

    <section class="paxg-strip" aria-live="polite">
      <div class="paxg-main">
        <span class="coin-dot"></span>
        <div>
          <div class="paxg-title">
            <strong>PAXG/USD - PAX Gold 美元</strong>
            <a href="https://hk.investing.com/crypto/pax-gold/paxg-usd" target="_blank" rel="noreferrer">Investing.com</a>
          </div>
          <div id="paxgMeta" class="paxg-meta">載入 PAXG/USD 即時資料中</div>
        </div>
      </div>
      <div class="paxg-price-box">
        <strong id="paxgPrice">--</strong>
        <span id="paxgChange" class="paxg-change">--</span>
      </div>
      <div class="paxg-stats">
        <span>24h 成交量 <strong id="paxgVolume">--</strong></span>
        <span>市值 <strong id="paxgMarketCap">--</strong></span>
        <span id="paxgStatus">尚未更新</span>
      </div>
    </section>

    <iframe id="dashboardFrame" title="原始黃金宏觀儀表板"></iframe>

    <script src="/app.js"></script>
  </body>
</html>
